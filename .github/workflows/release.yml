name: Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to retry on PyPI (otherwise uses the release tag at this commit)
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            image: quay.io/pypa/manylinux2014_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            image: quay.io/pypa/manylinux2014_aarch64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -v "$HOME/.cargo:/root/.cargo" \
            -v "$HOME/.rustup:/root/.rustup" \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_TARGET_DIR=rust/target/manylinux \
            -e PATH="/root/.cargo/bin:/opt/rh/devtoolset-10/root/usr/bin:/usr/local/bin:/usr/bin:/bin" \
            -w /project "$BUILD_IMAGE" \
            cargo build --release --locked --manifest-path rust/Cargo.toml -p commitkv-node
          mkdir -p native
          cp rust/target/manylinux/release/libcommitkv_node.so "native/commitkv-$BUILD_PLATFORM.node"
      - if: runner.os == 'macOS'
        run: bun run build/native
      - run: bun run build/types
      - run: bun wb test test/unit/store.test.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: native/commitkv-${{ matrix.platform }}.node
          if-no-files-found: error
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run build/types
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - run: bun scripts/packNpm.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package
          path: .tmp/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          install_args: bun node
      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-package
          path: .tmp
      - run: |
          mkdir -p .tmp/npm-consumer .tmp/bun-consumer
          for consumer in npm bun; do
            printf '%s\n' '{"private":true,"type":"module"}' > ".tmp/$consumer-consumer/package.json"
          done
          npm install --prefix .tmp/npm-consumer --no-audit --no-fund "$PWD"/.tmp/*.tgz
          cd .tmp/bun-consumer
          bun add "$GITHUB_WORKSPACE"/.tmp/*.tgz
      - name: Verify installed Node.js and Bun APIs
        run: |
          for consumer in npm bun; do
            cp test/fixtures/packageSmoke.mjs ".tmp/$consumer-consumer/smoke.mjs"
            (cd ".tmp/$consumer-consumer" && node smoke.mjs && bun smoke.mjs)
          done

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: install
    uses: WillBooster/reusable-workflows/.github/workflows/release.yml@main
    permissions:
      actions: write
      contents: write
      id-token: write
    with:
      github_hosted_runner: true
      skip_build: true
      artifact_name: npm-package
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  python-version:
    if: always() && (github.event_name == 'pull_request' || needs.release.result == 'success')
    needs: release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the published version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$IS_PULL_REQUEST" == 'true' ]]; then
            echo 'version=0.0.0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(git tag --points-at HEAD --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$version" ]]; then
            echo "::error::The requested version must match the release tag at this commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  python-build:
    needs: python-version
    if: always() && needs.python-version.result == 'success' && needs.python-version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64
          - runner: macos-15-intel
            platform: darwin-x64
            target: x86_64
          - runner: macos-15
            platform: darwin-arm64
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust
      - name: Set the Python package version
        env:
          RELEASE_VERSION: ${{ needs.python-version.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          file = Path("pyproject.toml")
          file.write_text(file.read_text().replace('version = "0.0.0"', f'version = "{os.environ["RELEASE_VERSION"]}"', 1))
          PYTHON
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --out .tmp/python-dist
      - name: Verify the installed wheel on Python 3.10 and 3.14
        run: |
          for version in 3.10 3.14; do
            uv venv --python "$version" ".tmp/python-$version"
            uv pip install --python ".tmp/python-$version/bin/python" .tmp/python-dist/*.whl pytest
            ".tmp/python-$version/bin/python" -m pytest test/unit/test_store.py
          done
      - if: matrix.platform == 'linux-x64'
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out .tmp/python-dist
      - if: matrix.platform == 'linux-x64'
        name: Verify the installed source distribution
        run: |
          uv venv --python 3.10 .tmp/python-source
          uv pip install --python .tmp/python-source/bin/python .tmp/python-dist/*.tar.gz pytest
          .tmp/python-source/bin/python -m pytest test/unit/test_store.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-${{ matrix.platform }}
          path: .tmp/python-dist/*
          include-hidden-files: true
          if-no-files-found: error
  pypi:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: python-build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/commitkv/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
