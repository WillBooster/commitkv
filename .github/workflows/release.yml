name: Prebuilt npm package
on:
  push:
    branches: [main, feat/npm-prebuilt-packages]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            image: quay.io/pypa/manylinux2014_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            image: quay.io/pypa/manylinux2014_aarch64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -v "$HOME/.cargo:/root/.cargo" \
            -v "$HOME/.rustup:/root/.rustup" \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_TARGET_DIR=rust/target/manylinux \
            -e PATH="/root/.cargo/bin:/opt/rh/devtoolset-10/root/usr/bin:/usr/local/bin:/usr/bin:/bin" \
            -w /project "$BUILD_IMAGE" \
            cargo build --release --locked --manifest-path rust/Cargo.toml -p kvzip-node
          mkdir -p native
          cp rust/target/manylinux/release/libkvzip_node.so "native/kvzip-$BUILD_PLATFORM.node"
      - if: runner.os == 'macOS'
        run: bun run build/native
      - run: bun run build/types
      - run: bun wb test test/unit/store.test.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: native/kvzip-${{ matrix.platform }}.node
          if-no-files-found: error
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run build/types
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - run: |
          mkdir -p .tmp
          npm pack --ignore-scripts --pack-destination .tmp
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package
          path: .tmp/*.tgz
          if-no-files-found: error
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          install_args: bun node
      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-package
          path: .tmp
      - run: |
          mkdir -p .tmp/npm-consumer .tmp/bun-consumer
          npm install --prefix .tmp/npm-consumer --ignore-scripts --no-audit --no-fund "$PWD"/.tmp/*.tgz
          cd .tmp/bun-consumer
          bun add --ignore-scripts "$GITHUB_WORKSPACE"/.tmp/*.tgz
      - name: Verify installed Node.js and Bun APIs
        run: |
          for consumer in npm bun; do
            cp test/fixtures/packageSmoke.mjs ".tmp/$consumer-consumer/smoke.mjs"
            (cd ".tmp/$consumer-consumer" && node smoke.mjs && bun smoke.mjs)
          done
