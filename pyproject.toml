[project]
name = "commitkv"
version = "0.0.0"
description = "Compressed key-value store for git-managed caches: append-only segments that never exceed a size limit"
readme = "README.md"
requires-python = "==3.15.0"
license = "Apache-2.0"

[project.urls]
Repository = "https://github.com/WillBooster/commitkv"
Issues = "https://github.com/WillBooster/commitkv/issues"

[dependency-groups]
dev = ["black>=26.10.1", "flake8>=7.4.1", "isort>=9.0.2", "pytest==9.1.1"]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/crates/commitkv-python/Cargo.toml"
python-source = "python"
module-name = "commitkv._native"
include = [{ path = "LICENSE", format = "sdist" }]

# Rebuild the extension module when the Rust sources or manifests change.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "rust/Cargo.lock" },
  { file = "rust/Cargo.toml" },
  { file = "rust/crates/**/Cargo.toml" },
  { file = "rust/crates/**/*.rs" },
]
